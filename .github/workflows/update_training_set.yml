name: Update Training Set from Novig Odds

on:
  schedule:
    - cron: '30 17 * * *'  # Runs daily at 10:30 AM PT (17:30 UTC)
  workflow_dispatch:        # Allow manual runs from GitHub Actions tab

jobs:
  update-training-set:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          pip install pandas requests python-dateutil pytz

      # Step 4: Run Novig NBA odds pull
      - name: Pull Novig NBA odds
        run: |
          python src/novig_nba_odds.py

      # Step 5: Commit and push updated data
      - name: Commit and push updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add updated data files
          git add "data/NBA Training Set 25-26.csv" || true
          git add data/novig-odds/*.csv || true

          git commit -m "🗓️ Daily data update from Novig ($(date -u +"%Y-%m-%d %H:%M UTC"))" || echo "No changes to commit"
          git push
