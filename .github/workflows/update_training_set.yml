name: Update Training Set from Google Sheets

on:
  schedule:
    - cron: '45 16 * * *'  # Runs daily at 9:45 AM PT (16:45 UTC)
  workflow_dispatch:

jobs:
  update-training-set:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas requests python-dateutil pytz \
            google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Create service account file
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Run Google Sheet extractor
        run: |
          python google-sheet-extract.py

      # NEW: Pull Novig NBA odds and save CSV(s)
      - name: Run Novig NBA odds pull
        run: |
          python src/novig_nba_odds.py

      - name: Commit and push updated data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add Sheet + Novig outputs (ignore absence without failing)
          git add data/training_set_*.csv data/training_set_latest.csv || true
          git add data/novig-odds/*.csv || true

          # Commit only if there are staged changes
          git commit -m "Daily data update (Sheets + Novig) on $(date -u +"%Y-%m-%d %H:%M:%S UTC")" || echo "No changes to commit"

          # Push (will be a no-op if nothing changed)
          git push
