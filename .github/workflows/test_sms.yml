name: 📱 Test SMS Notifications

on:
  workflow_dispatch:  # Manual trigger only for testing
    inputs:
      phone_number:
        description: 'Phone number to send test to (format: +1234567890)'
        required: true
        type: string
      message:
        description: 'Custom test message (optional)'
        required: false
        type: string

jobs:
  send-test-sms:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install Twilio
        run: |
          python -m pip install --upgrade pip
          pip install twilio

      - name: 📱 Send Test SMS
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TEST_PHONE_NUMBER: ${{ github.event.inputs.phone_number }}
        run: |
          python src/send_test_sms.py

      - name: ✅ Test Complete
        run: |
          echo "SMS test completed!"
          echo "Check your phone for the test message."
