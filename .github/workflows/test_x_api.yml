name: 🐦 Test X API Connection

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  test-x-api:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📂 Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tweepy pandas numpy scikit-learn
      
      - name: 🔐 Test X API Authentication
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET_KEY: ${{ secrets.X_API_SECRET_KEY }}
          X_ACCESS_TOLKEN: ${{ secrets.X_ACCESS_TOLKEN }}
          X_ACCESS_TOLKEN_SECRET: ${{ secrets.X_ACCESS_TOLKEN_SECRET }}
        run: |
          echo "Testing X API authentication..."
          python src/test_x_auth.py
      
      - name: 📊 Preview Today's Tweet
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET_KEY: ${{ secrets.X_API_SECRET_KEY }}
          X_ACCESS_TOLKEN: ${{ secrets.X_ACCESS_TOLKEN }}
          X_ACCESS_TOLKEN_SECRET: ${{ secrets.X_ACCESS_TOLKEN_SECRET }}
        run: |
          echo ""
          echo "Generating tweet preview..."
          python src/post_to_x.py --test
