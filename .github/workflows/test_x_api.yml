name: 🐦 Post NBA Predictions to X

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📂 Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tweepy pandas numpy scikit-learn requests-oauthlib
      
      - name: 🐦 Post Today's Predictions to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET_KEY: ${{ secrets.X_API_SECRET_KEY }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          echo "🐦 Posting today's NBA predictions to X..."
          python src/post_to_x.py
