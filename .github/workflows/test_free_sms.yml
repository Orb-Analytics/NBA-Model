name: 📱 Test Free SMS

on:
  workflow_dispatch:  # Manual trigger

jobs:
  send-sms:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 🔍 Check Secrets
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          echo "Checking if secrets are configured..."
          if [ -z "$GMAIL_ADDRESS" ]; then
            echo "❌ GMAIL_ADDRESS secret is not set"
          else
            echo "✅ GMAIL_ADDRESS is set"
          fi
          
          if [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "❌ GMAIL_APP_PASSWORD secret is not set"
          else
            echo "✅ GMAIL_APP_PASSWORD is set"
          fi

      - name: 📱 Send Test SMS (AT&T)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 << 'EOF'
          import os
          import smtplib
          from email.mime.text import MIMEText

          gmail = os.environ.get('GMAIL_ADDRESS')
          password = os.environ.get('GMAIL_APP_PASSWORD')
          
          if not gmail or not password:
              print("❌ Missing credentials. Please set GMAIL_ADDRESS and GMAIL_APP_PASSWORD secrets in GitHub repo settings.")
              print("Go to: Settings → Secrets and variables → Actions → New repository secret")
              exit(1)

          phone = '2065511390'
          message = 'test'
          sms_address = f"{phone}@txt.att.net"

          print(f"Sending to: {sms_address}")
          print(f"From: {gmail}")
          print(f"Message: {message}")
          
          try:
              msg = MIMEText(message)
              msg['From'] = gmail
              msg['To'] = sms_address
              msg['Subject'] = ''
              
              print("\nConnecting to Gmail SMTP...")
              server = smtplib.SMTP('smtp.gmail.com', 587)
              server.set_debuglevel(1)  # Show detailed output
              server.starttls()
              
              print("\nLogging in...")
              server.login(gmail, password)
              
              print("\nSending message...")
              server.send_message(msg)
              server.quit()
              
              print("\n✅ SMS sent successfully via AT&T!")
              print("Check your phone for 'test' message")
          except Exception as e:
              print(f"\n❌ Failed: {e}")
              print("\nTroubleshooting:")
              print("1. Make sure you created a Gmail App Password (not regular password)")
              print("2. Go to: https://myaccount.google.com/apppasswords")
              print("3. Enable 2-Step Verification first if not already on")
              print("4. Create new app password for 'Mail'")
              print("5. Add it as GMAIL_APP_PASSWORD secret in GitHub")
              exit(1)
          EOF

      - name: ✅ Done
        run: echo "SMS test finished - check your phone for 'test' message"
