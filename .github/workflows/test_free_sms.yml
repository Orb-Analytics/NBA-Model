name: 📱 Test Free SMS

on:
  workflow_dispatch:  # Manual trigger

jobs:
  send-sms:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 🔍 Check Secrets
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          echo "Checking if secrets are configured..."
          if [ -z "$SMTP_USERNAME" ]; then
            echo "❌ SMTP_USERNAME secret is not set"
          else
            echo "✅ SMTP_USERNAME is set"
          fi
          
          if [ -z "$SMTP_PASSWORD" ]; then
            echo "❌ SMTP_PASSWORD secret is not set"
          else
            echo "✅ SMTP_PASSWORD is set"
          fi
          
          echo "SMTP Server: $SMTP_SERVER"
          echo "SMTP Port: $SMTP_PORT"

      - name: 📱 Send Test SMS (AT&T)
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          python3 << 'EOF'
          import os
          import smtplib
          from email.mime.text import MIMEText

          smtp_user = os.environ.get('SMTP_USERNAME')
          smtp_pass = os.environ.get('SMTP_PASSWORD')
          smtp_server = os.environ.get('SMTP_SERVER', 'smtp.gmail.com')
          smtp_port = int(os.environ.get('SMTP_PORT', '587'))
          
          if not smtp_user or not smtp_pass:
              print("❌ Missing SMTP credentials")
              exit(1)

          phone = '2065511390'
          message = 'test'
          sms_address = f"{phone}@txt.att.net"

          print(f"Sending to: {sms_address}")
          print(f"From: {smtp_user}")
          print(f"Server: {smtp_server}:{smtp_port}")
          print(f"Message: {message}")
          
          try:
              msg = MIMEText(message)
              msg['From'] = smtp_user
              msg['To'] = sms_address
              msg['Subject'] = ''
              
              print(f"\nConnecting to {smtp_server}:{smtp_port}...")
              server = smtplib.SMTP(smtp_server, smtp_port)
              server.set_debuglevel(1)
              server.starttls()
              
              print("\nLogging in...")
              server.login(smtp_user, smtp_pass)
              
              print("\nSending message...")
              server.send_message(msg)
              server.quit()
              
              print("\n✅ SMS sent successfully via AT&T!")
              print("Check your phone for 'test' message")
          except Exception as e:
              print(f"\n❌ Failed: {e}")
              exit(1)
          EOF

      - name: ✅ Done
        run: echo "SMS test finished - check your phone for 'test' message"
