name: Update Training Set from Google Sheets

on:
  schedule:
    - cron: '0 14 * * *'  # Runs daily at 7 AM PT (14:00 UTC)
  workflow_dispatch:        # Allows manual runs from the GitHub Actions tab

jobs:
  update-training-set:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          pip install pandas google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      # Step 4: Recreate your service account JSON from GitHub Secret
      - name: Create service account file
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      # Step 5: Run your extraction notebook as a Python script
      - name: Run Google Sheet extract
        run: |
          jupyter nbconvert --to python google-sheet-extract.ipynb
          python google-sheet-extract.py

      # Step 6: Commit and push updated training_set.csv
      - name: Commit and push updated training set
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/training_set.csv
          git commit -m "Auto-update training_set.csv from Google Sheets $(date)" || echo "No changes to commit"
          git push
