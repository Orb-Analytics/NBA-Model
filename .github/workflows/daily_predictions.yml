name: 🎯 Generate & Email Daily Predictions

on:
  workflow_run:
    workflows: ["📧 Email NBA Dataset"]
    types:
      - completed
  workflow_dispatch:  # Allow manual testing
    inputs:
      prediction_date:
        description: 'Date to predict (YYYY-MM-DD, default: today)'
        required: false
        type: string

jobs:
  predict-and-email:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 📂 Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: 🎯 Generate & Email Today's Predictions
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.prediction_date }}" ]; then
            PRED_DATE="${{ github.event.inputs.prediction_date }}"
          else
            PRED_DATE=$(date -u +%Y-%m-%d)
          fi
          
          echo "🔮 Generating and emailing predictions for: $PRED_DATE"
          echo "📊 Models will use full season history for record tracking"
          echo ""
          
          # Run prediction script with email sending enabled
          # This script will:
          # 1. Load complete model history from data/model_results/model_picks_history.csv
          # 2. Calculate current season records (W-L-P) for all 4 models
          # 3. Generate predictions for today's games
          # 4. Format email showing records + all 4 model picks per game
          # 5. Send email to configured recipients
          python src/predict_and_email.py --date "$PRED_DATE"
