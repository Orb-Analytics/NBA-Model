name: 🎯 Generate & Email Daily Predictions

on:
  workflow_run:
    workflows: ["📧 Email NBA Dataset"]
    types:
      - completed
  workflow_dispatch:  # Allow manual testing
    inputs:
      prediction_date:
        description: 'Date to predict (YYYY-MM-DD, default: today)'
        required: false
        type: string

jobs:
  predict-and-email:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 📂 Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn tweepy

      - name: 🎯 Generate & Email Today's Predictions
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.prediction_date }}" ]; then
            PRED_DATE="${{ github.event.inputs.prediction_date }}"
          else
            PRED_DATE=$(date -u +%Y-%m-%d)
          fi
          
          echo "🔮 Generating and emailing averaged model predictions for: $PRED_DATE"
          echo "📊 Using standardized & averaged model (35% models + 65% implied)"
          echo ""
          
          # Run daily backtest update (auto-detects latest data)
          # This regenerates unified results and runs backtest with all available games
          echo "📊 Updating backtest with latest data..."
          python src/daily_backtest_update.py
          
          echo ""
          
          # Run averaged model prediction script with email sending enabled
          # This script will:
          # 1. Show yesterday's pick results
          # 2. Display current season record
          # 3. Generate today's predictions using standardized & averaged model
          # 4. Send email to configured recipients
          python src/predict_and_email_averaged.py --date "$PRED_DATE"

      - name: 💾 Commit updated predictions and results
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/averaged_model_backtest.csv
          git add data/averaged_model_predictions_history.csv
          git add data/unified_model_results.csv
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Update averaged model predictions and results for $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 🐦 Post Predictions to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET_KEY: ${{ secrets.X_API_SECRET_KEY }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [ -n "${{ github.event.inputs.prediction_date }}" ]; then
            PRED_DATE="${{ github.event.inputs.prediction_date }}"
          else
            # Use Pacific Time date (UTC-8 hours) to ensure correct date at 11am PT
            PRED_DATE=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          fi
          
          echo "🐦 Posting predictions for $PRED_DATE to X..."
          python src/post_to_x.py --date "$PRED_DATE"
