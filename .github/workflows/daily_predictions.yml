name: 🎯 Generate & Email Daily Predictions

on:
  workflow_run:
    workflows: ["📧 Email NBA Dataset"]
    types:
      - completed
  workflow_dispatch:  # Allow manual testing
    inputs:
      prediction_date:
        description: 'Date to predict (YYYY-MM-DD, default: today)'
        required: false
        type: string

jobs:
  predict-and-email:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 📂 Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: 🎯 Generate Today's Predictions
        id: predictions
        run: |
          if [ -n "${{ github.event.inputs.prediction_date }}" ]; then
            PRED_DATE="${{ github.event.inputs.prediction_date }}"
          else
            PRED_DATE=$(date -u +%Y-%m-%d)
          fi
          
          echo "Generating predictions for: $PRED_DATE"
          
          # Run prediction script and capture output
          python src/predict_today.py "$PRED_DATE" > predictions_output.txt 2>&1
          EXIT_CODE=$?
          
          # Show the output
          cat predictions_output.txt
          
          # Store the date for later steps
          echo "prediction_date=$PRED_DATE" >> $GITHUB_OUTPUT
          
          # Exit with the script's exit code
          exit $EXIT_CODE

      - name: 📝 Prepare Email Body
        id: email_body
        run: |
          PRED_DATE="${{ steps.predictions.outputs.prediction_date }}"
          REPO="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          cat > email_body.txt << EOF
          NBA Spread Predictions for ${PRED_DATE}
          
          Generated using rolling logistic regression with dynamic feature selection.
          
          ────────────────────────────────────────────────────────────────────
          
          EOF
          
          cat predictions_output.txt >> email_body.txt
          
          cat >> email_body.txt << EOF
          
          ────────────────────────────────────────────────────────────────────
          
          Repository: ${REPO}
          Workflow Run: ${RUN_URL}
          
          Good luck! 🍀
          EOF
          
          # Show the email content for debugging
          echo "Email body content:"
          cat email_body.txt

      - name: 📧 Send Predictions Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🏀 NBA Spread Predictions - ${{ steps.predictions.outputs.prediction_date }}"
          body: "See attached file for today's NBA spread predictions. Good luck! 🍀"
          to: lpchaitin@gmail.com,eborsook@gmail.com
          from: NBA Predictions Bot <noreply@github.com>
          attachments: email_body.txt
          convert_markdown: false

      - name: 💾 Upload predictions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ steps.predictions.outputs.prediction_date }}
          path: predictions_output.txt
          retention-days: 30
