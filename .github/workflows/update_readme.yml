name: 📝 Update README with Current Record

on:
  workflow_run:
    workflows: ["🎯 Generate & Email Daily Predictions"]
    types:
      - completed
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 📂 Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: 📊 Get Current Record from Backtest
        id: get_record
        run: |
          python << 'EOF'
          import pandas as pd
          from datetime import datetime
          
          # Read backtest file
          df = pd.read_csv('data/averaged_model_backtest.csv')
          
          # Filter for picks only (not NO BET)
          picks = df[df['pick_side'] != 'NO BET'].copy()
          
          # Count wins and losses
          wins = (picks['result'] == 'WIN').sum()
          losses = (picks['result'] == 'LOSS').sum()
          total = wins + losses
          
          if total > 0:
              win_pct = (wins / total) * 100
          else:
              win_pct = 0.0
          
          # Get the last game date
          picks['date'] = pd.to_datetime(picks['date'])
          last_date = picks['date'].max().strftime('%B %d, %Y')
          
          # Write to GitHub output
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'wins={wins}\n')
              f.write(f'losses={losses}\n')
              f.write(f'win_pct={win_pct:.1f}\n')
              f.write(f'last_date={last_date}\n')
          
          print(f"Record: {wins}-{losses} ({win_pct:.1f}%) through {last_date}")
          EOF

      - name: 📝 Update README
        run: |
          WINS="${{ steps.get_record.outputs.wins }}"
          LOSSES="${{ steps.get_record.outputs.losses }}"
          WIN_PCT="${{ steps.get_record.outputs.win_pct }}"
          LAST_DATE="${{ steps.get_record.outputs.last_date }}"
          
          # Update the performance line in README
          sed -i "s/\*\*[0-9]\+-[0-9]\+ ([0-9.]\+%)\*\* through [A-Za-z]* [0-9]\+, [0-9]\+/\*\*${WINS}-${LOSSES} (${WIN_PCT}%)\*\* through ${LAST_DATE}/" README.md
          
          echo "Updated README.md with record: ${WINS}-${LOSSES} (${WIN_PCT}%) through ${LAST_DATE}"

      - name: 💾 Commit & Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          
          if git diff --quiet README.md; then
            echo "No changes to README.md"
          else
            git add README.md
            git commit -m "📝 Update README with current record: ${{ steps.get_record.outputs.wins }}-${{ steps.get_record.outputs.losses }} (${{ steps.get_record.outputs.win_pct }}%)"
            git push
            echo "✅ README updated successfully"
          fi
