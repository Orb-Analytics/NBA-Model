name: 🧪 Test Email Subscriber Sheet Connection

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: 🔑 Create service account file
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: 🧪 Test connection to email subscriber sheet
        env:
          EMAIL_SUBSCRIBERS_SHEET_ID: ${{ secrets.EMAIL_SUBSCRIBERS_SHEET_ID }}
        run: |
          echo "Testing connection to Google Sheet..."
          echo ""
          python src/test_sheets_connection.py
